name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Construire le logiciel de caisse Windows
        run: npm run dist:win

      - name: Publier le .exe
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Caisse-Windows
          path: |
            apps/local/release/*.exe
            apps/local/release/*.blockmap
          if-no-files-found: error
